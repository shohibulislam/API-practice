<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOM - API - PART-02</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Azeret+Mono:ital,wght@0,100..900;1,100..900&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap');
        body{
            padding: 0;
            margin: 0;
            box-sizing: border-box;
            font-family: "Poppins", sans-serif;
            height: 100dvh;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            padding: 30px 0;
        }
        
        #user-container{
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            gap: 10px;
        }
        .user{
            border: 1px solid lightgray;
            border-radius: 16px;
            background-color: #93c5fd;
            max-width: 400px;
            display: flex;
            flex-direction: column;
            padding: 20px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            transition: all 0.3s ease;
        }
        .user:hover{
            transform: scale(1.02);
        }
    </style>
</head>
<body>
    <h1 class="bg-blue-300">All User from JSONPlaceholder Fake User API</h1>
    <div id="user-container">

    </div>
    <a style="background-color: #3b82f6; width: fit-content;" href="" target="_blank"></a>
    <script src="script.js"></script>
</body>
</html>
